<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #555; --done: #888; --border: #ddd;
    --field-bg: #ffffff; --field-border: #767676; --btn-bg: #efefef;
    --badge-bg: #e8eefc; --badge-fg: #223; --overdue: #c00;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #16181d; --fg: #e8e8e8; --muted: #a0a4ab; --done: #6f737a; --border: #2d3038;
    --field-bg: #21242b; --field-border: #4a4e57; --btn-bg: #2a2d35;
    --badge-bg: #2b3550; --badge-fg: #d6e0ff; --overdue: #ff6b6b;
    color-scheme: dark;
  }
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 16px; background: var(--bg); color: var(--fg); }
  header { display: flex; flex-direction: column; align-items: stretch; }
  h1 { text-align: center; margin-top: .3em; color: #d32f2f; }
  #theme { order: -1; align-self: flex-end; }
  input, select, button { background: var(--field-bg); color: var(--fg); border: 1px solid var(--field-border); border-radius: 4px; }
  button { background: var(--btn-bg); }
  input[type=checkbox] { accent-color: #3b6fe0; }
  form { display: flex; flex-wrap: wrap; gap: 8px; }
  input[type=text], input[type=date], select { padding: 8px; font-size: 1rem; }
  #text { flex: 1 1 100%; }
  #category { flex: 1 1 120px; min-width: 0; }
  #due { flex: 0 1 auto; }
  button { padding: 8px 12px; font-size: 1rem; cursor: pointer; }
  #theme { display: flex; gap: 4px; }
  #theme button { padding: 6px 8px; line-height: 0; min-width: 40px; min-height: 40px; }
  /* comfortable touch targets on phones */
  input[type=checkbox] { width: 22px; height: 22px; flex: none; }
  li button { min-width: 44px; min-height: 44px; }
  @media (max-width: 480px) { form button { flex: 1 1 100%; min-height: 44px; } }
  #theme button[aria-pressed="true"] { background: #3b6fe0; border-color: #3b6fe0; color: #fff; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .body { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .title { flex: 1 1 100%; overflow-wrap: anywhere; }
  .badge { font-size: .8rem; background: var(--badge-bg); color: var(--badge-fg); border-radius: 10px; padding: 1px 8px; }
  .due { font-size: .8rem; color: var(--muted); }
  .due.overdue { color: var(--overdue); font-weight: 600; }
  li.done .title { text-decoration: line-through; color: var(--done); }
  li.done .due { color: var(--done); font-weight: normal; }
  .body input, .body select { padding: 4px; font-size: 1rem; }
  .body input.edit-text { flex: 1 1 100%; }
  .body select.edit-cat { flex: 1 1 100px; min-width: 0; }
</style>
</head>
<body>
<header>
  <h1>To-Do</h1>
  <div id="theme" role="group" aria-label="Theme">
    <button type="button" data-theme-val="light" aria-label="Light mode" title="Light mode"></button>
    <button type="button" data-theme-val="dark" aria-label="Dark mode" title="Dark mode"></button>
  </div>
</header>
<form id="form">
  <input type="text" id="text" placeholder="New item" autocomplete="off">
  <select id="category" aria-label="Category">
    <option>Work</option>
    <option>Personal</option>
    <option>Others</option>
  </select>
  <input type="date" id="due" aria-label="Due date">
  <button type="submit">Add</button>
</form>
<ul id="list"></ul>
<script>
  const CATEGORIES = ['Work', 'Personal', 'Others'];
  let todos = [];
  let nextId = 1;
  let editingId = null;
  const list = document.getElementById('list');
  const input = document.getElementById('text');
  const catInput = document.getElementById('category');
  const dueInput = document.getElementById('due');
  const themeBox = document.getElementById('theme');
  const SVG_OPEN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="pointer-events:none;display:block">';
  const ICON_SUN = SVG_OPEN + '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const ICON_MOON = SVG_OPEN + '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
  themeBox.querySelector('[data-theme-val="light"]').innerHTML = ICON_SUN;
  themeBox.querySelector('[data-theme-val="dark"]').innerHTML = ICON_MOON;

  // Theme: saved choice if any, otherwise the system preference
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    for (const b of themeBox.querySelectorAll('button')) {
      b.setAttribute('aria-pressed', String(b.dataset.themeVal === t));
    }
  }
  let savedTheme = null;
  try { savedTheme = localStorage.getItem('todo-theme'); } catch (e) {}
  applyTheme(savedTheme === 'light' || savedTheme === 'dark'
    ? savedTheme
    : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  themeBox.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    applyTheme(b.dataset.themeVal);
    try { localStorage.setItem('todo-theme', b.dataset.themeVal); } catch (err) {}
  });

  const ICON_PENCIL = SVG_OPEN + '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  const ICON_BIN = SVG_OPEN + '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';

  function todayStr() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function formatDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function field(cls, type, value, placeholder, extra) {
    const el = document.createElement('input');
    el.type = type;
    el.className = cls;
    el.value = value;
    if (placeholder) el.placeholder = placeholder;
    if (extra) for (const k in extra) el.setAttribute(k, extra[k]);
    return el;
  }

  function categorySelect(value) {
    const sel = document.createElement('select');
    sel.className = 'edit edit-cat';
    sel.setAttribute('aria-label', 'Category');
    for (const c of CATEGORIES) {
      const o = document.createElement('option');
      o.textContent = c;
      sel.append(o);
    }
    sel.value = value;
    return sel;
  }

  function render() {
    list.innerHTML = '';
    const today = todayStr();
    let firstField = null;
    for (const t of todos) {
      const li = document.createElement('li');
      li.dataset.id = t.id;
      if (t.done) li.className = 'done';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = t.done;

      const body = document.createElement('div');
      body.className = 'body';
      if (t.id === editingId) {
        firstField = field('edit edit-text', 'text', t.text, 'Item');
        body.append(
          firstField,
          categorySelect(t.category),
          field('edit edit-due', 'date', t.due, '', { 'aria-label': 'Due date' })
        );
      } else {
        const title = document.createElement('span');
        title.className = 'title';
        title.textContent = t.text;
        const b = document.createElement('span');
        b.className = 'badge';
        b.textContent = t.category;
        body.append(title, b);
        if (t.due) {
          const d = document.createElement('span');
          d.className = 'due' + (!t.done && t.due < today ? ' overdue' : '');
          d.textContent = (t.due < today && !t.done ? 'Overdue: ' : 'Due: ') + formatDate(t.due);
          body.append(d);
        }
      }

      const edit = document.createElement('button');
      edit.innerHTML = ICON_PENCIL;
      edit.className = 'edit-btn';
      edit.setAttribute('aria-label', 'Edit');
      const del = document.createElement('button');
      del.innerHTML = ICON_BIN;
      del.className = 'del-btn';
      del.setAttribute('aria-label', 'Delete');
      li.append(cb, body, edit, del);
      list.append(li);
    }
    if (firstField) { firstField.focus(); firstField.select(); }
  }

  function finishEdit(save, li) {
    const t = todos.find(t => t.id === editingId);
    editingId = null;
    if (save && t && li) {
      const text = li.querySelector('.edit-text').value.trim();
      if (text) {
        t.text = text;
        t.category = li.querySelector('.edit-cat').value;
        t.due = li.querySelector('.edit-due').value;
      }
    }
    render();
  }

  list.addEventListener('keydown', e => {
    if (!e.target.classList.contains('edit')) return;
    const li = e.target.closest('li');
    if (e.key === 'Enter') { e.preventDefault(); finishEdit(true, li); }
    else if (e.key === 'Escape') finishEdit(false);
  });

  // Save when focus leaves the row's edit fields (but not when moving between them)
  list.addEventListener('focusout', e => {
    if (!e.target.classList.contains('edit') || editingId === null) return;
    const li = e.target.closest('li');
    if (e.relatedTarget && li.contains(e.relatedTarget)) return;
    finishEdit(true, li);
  });

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos.push({
      id: nextId++,
      text,
      category: catInput.value,
      due: dueInput.value,
      done: false
    });
    input.value = '';
    dueInput.value = '';
    render();
  });

  list.addEventListener('click', e => {
    const li = e.target.closest('li');
    if (!li) return;
    const id = Number(li.dataset.id);
    if (e.target.classList.contains('del-btn')) {
      todos = todos.filter(t => t.id !== id);
      if (editingId === id) editingId = null;
    } else if (e.target.classList.contains('edit-btn')) {
      editingId = id;
    } else if (e.target.type === 'checkbox') {
      const t = todos.find(t => t.id === id);
      t.done = e.target.checked;
    } else return;
    render();
  });

  // Sample data for screenshots/mock-ups only: open index.html#demo or #demo-dark
  if (location.hash.startsWith('#demo')) {
    const day = n => { const d = new Date(); d.setDate(d.getDate() + n); const p = x => String(x).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); };
    todos = [
      { id: 1, text: 'Send quarterly report to finance', category: 'Work', due: day(-1), done: false },
      { id: 2, text: 'Book dentist appointment', category: 'Personal', due: day(3), done: false },
      { id: 3, text: 'Buy groceries', category: 'Others', due: '', done: false },
      { id: 4, text: 'Renew gym membership', category: 'Personal', due: day(10), done: true },
      { id: 5, text: 'Prepare Monday team agenda', category: 'Work', due: day(5), done: false }
    ];
    nextId = 6;
    if (location.hash.includes('dark')) applyTheme('dark');
    render();
  }
</script>
</body>
</html>
